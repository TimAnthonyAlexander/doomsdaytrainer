server {
	server_name doomsday.timanthonyalexander.de;
	client_max_body_size 16M;

	root /var/www/doomsday/dist;
	# `global` points 404/500/503 at lairner.app; this is a different product,
	# so keep the status codes local and bare.
	error_page 404 = @dd_404;
	error_page 500 = @dd_500;
	error_page 503 = @dd_503;
	location @dd_404 { return 404; }
	location @dd_500 { return 500; }
	location @dd_503 { return 503; }

	include global;

	access_log /var/log/nginx/doomsday_access.log;
	error_log  /var/log/nginx/doomsday_error.log warn;

	# Vite emits content-hashed filenames into /assets/, so they can be
	# pinned forever. Anything missing is a 404, never an index.html fallback.
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Self-hosted woff2 — same hashing guarantee as /assets/.
	location ^~ /fonts/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Spoken clips. Not content-hashed either, but the path carries the set
	# version (/audio/v1/), and a regeneration with a different voice bumps
	# it — so a cached clip can never be the wrong voice.
	location ^~ /audio/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The service worker must never be served stale, or a client can pin
	# itself to an old precache manifest and stop taking updates.
	location = /sw.js {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "public, max-age=3600";
		try_files $uri =404;
	}

	location = /favicon.svg { try_files $uri =404; access_log off; log_not_found off; }
	location = /robots.txt  { try_files $uri =404; access_log off; log_not_found off; }

	location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	# SPA fallback. index.html itself carries the asset hashes, so it has to
	# be revalidated on every load.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/index.html /index.html;
	}

	# Issued and renewed by certbot; do not hand-edit the two lines below.
    ssl_certificate /etc/letsencrypt/live/doomsday.timanthonyalexander.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/doomsday.timanthonyalexander.de/privkey.pem; # managed by Certbot
}

# Without this, plain-HTTP requests that reach the origin directly (bypassing
# the CDN edge) fall through to whichever :80 block sorts first.
server {
	listen 80;
	listen [::]:80;
	server_name doomsday.timanthonyalexander.de;
	return 301 https://doomsday.timanthonyalexander.de$request_uri;
}
